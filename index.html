<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NEXT</title>
<style>
@font-face{font-family:Lilita;src:url(fonts/LilitaOne-Regular.ttf)}
:root{--blue:#2f7fe0;--blue-d:#1d5aa8;--red:#e0503a;--red-d:#a83424;--felt:#1f6b45;--felt-d:#154d31;--gold:#ffd24a;--cell:min(8.6vw,40px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:var(--felt-d);overflow:hidden;font-family:Lilita,system-ui,sans-serif;color:#fff}
body{background:radial-gradient(ellipse at 50% 45%,#2a8458 0%,var(--felt) 45%,var(--felt-d) 100%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{position:relative;height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column;align-items:center}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:22px}
.pt{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:12px;background:#0003}
.pt i{width:14px;height:14px;border-radius:4px;display:inline-block}
.time{font-size:30px;min-width:60px;text-align:center}
.zone{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.opp{flex:1.1}.mid{flex:1.3}.me{flex:1.4}
/* ゲージ */
.gwrap{position:relative;width:calc(var(--cell)*10)}
.gauge{display:flex;gap:0;padding:4px;border-radius:12px;background:#0d3a24;box-shadow:inset 0 3px 8px #0008,0 2px 0 #fff2;width:calc(var(--cell)*10 + 8px);margin-left:-4px}
.c{width:var(--cell);height:var(--cell);border-radius:6px;border:2px dashed #ffffff30;margin:0}
.c.b{background:var(--blue);border:2px solid var(--blue-d)}
.c.r{background:var(--red);border:2px solid var(--red-d)}
.c.first{position:relative}
.c.first span{position:absolute;left:3px;top:0;font-size:calc(var(--cell)*.45);color:#fff;text-shadow:0 1px 0 #0006}
.left{margin-top:8px;font-size:18px;opacity:.85;text-align:center}
.left b{font-size:26px;color:var(--gold)}
/* 次の札ブロック */
.blk{position:absolute;display:flex;transition:left .12s}
.blk .c{border-style:solid}
.blk.me .c{background:var(--blue);border-color:#fff}
.blk.op .c{background:var(--red);border-color:#fff}
.blk .c.over{background:#0000;border:2px dashed #ff8a7a}
.blk.fit .c{box-shadow:0 0 14px var(--gold);border-color:var(--gold)}
.blk.ng{opacity:.4}
.blk .num{position:absolute;right:-34px;top:50%;transform:translateY(-50%);font-size:calc(var(--cell)*.8);text-shadow:0 2px 0 #0006}
.lane{position:relative;height:calc(var(--cell)*1.1);width:calc(var(--cell)*10)}
.small{display:flex;gap:6px;margin-top:6px;opacity:.75;font-size:15px;align-items:center}
.small .mini{display:flex}
.small .mini i{width:9px;height:9px;border-radius:2px;margin-right:1px;display:block}
.me .mini i{background:var(--blue)}.opp .mini i{background:var(--red)}
.btns{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 18px 18px;gap:40px}
.btn{border:none;border-radius:16px;font-family:inherit;color:#fff;font-size:22px;box-shadow:0 5px 0 #0006}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0006}
.btn.dis{background:#6d5a44;width:30%;height:56px;font-size:18px}
.btn.play{background:var(--blue);width:52%;height:76px;font-size:28px}
.btn[disabled]{filter:grayscale(.7) brightness(.8)}
.tag{font-size:11px;opacity:.6;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0008;z-index:5;text-align:center;padding:20px}
.overlay h1{font-size:44px}.overlay p{font-size:16px;line-height:1.7;opacity:.9;font-family:system-ui,sans-serif}
.overlay .btn{background:var(--blue);width:220px;height:58px}
.lv{display:flex;gap:10px}.lv .btn{width:auto;padding:0 16px;height:50px;background:#355}
.lv .btn.on{background:var(--blue)}
.big{position:absolute;left:0;right:0;top:25%;text-align:center;font-size:64px;text-shadow:0 4px 0 #0007;pointer-events:none;z-index:4}
.msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:34px;pointer-events:none;z-index:4;text-shadow:0 3px 0 #0008}
.msg.p{color:#9fd0ff}.msg.d{color:#ffb3a6}
</style></head>
<body><div id="app"></div>
<script>
// NEXT オンライン版の試作：場を「10マスのゲージ」で見せる（くるみ案 9/23）
// ボタンは仮（画像はくるみが後で用意）。数値は CFG に集約
const CFG={winPt:10,roundSec:10,countFrom:5,countStepMs:650,goMs:500,holdMs:1500,timeUpMs:1200,queueN:3};
const AI={easy:{label:'やさしい',delay:1250,jitter:600,read:.3,safe:.4},normal:{label:'ふつう',delay:650,jitter:650,read:.7,safe:.55},hard:{label:'つよい',delay:360,jitter:300,read:.95,safe:.85}};
// ── ルール（本体のネクストと同じ。canPlay・calcPts は本体からそのまま）
function canPlay(v,fieldSum,field){
  if(field.filter(x=>x!==null).length>=4)return false;
  const filled=field.filter(x=>x!==null).length+1;
  const newSum=fieldSum+v;
  if(filled===3&&newSum<5)return false;
  if(filled===4&&newSum<10)return false;
  return true;
}
function calcPts(cards){
  const s=[...cards].sort((a,b)=>a-b);
  if(cards.length===4&&s.join('')==='1234')return{total:5,label:'ストレート'};
  if(cards.length===2&&s[0]===5&&s[1]===5)return{total:1,label:'役なし'};
  const freq={};cards.forEach(v=>{freq[v]=(freq[v]||0)+1;});
  const counts=Object.values(freq);
  if(counts.some(c=>c>=3))return{total:4,label:'スリーカード'};
  if(counts.filter(c=>c===2).length>=2)return{total:3,label:'ツーペア'};
  if(counts.some(c=>c===2))return{total:2,label:'ワンペア'};
  return{total:1,label:'役なし'};
}
const vals=f=>f.map(x=>x.v),sum=f=>f.reduce((a,x)=>a+x.v,0);
function legal(v,f){const s=sum(f);return v>=1&&v<=5&&f.length<4&&s+v<=10&&canPlay(v,s,vals(f));}
function draw(q){while(q.length<CFG.queueN+6){const v=1+Math.floor(Math.random()*5);if(q.length>=2&&q.slice(-2).every(x=>x===v))continue;q.push(v);}return q;}
// ── 状態
let S={phase:'title',level:'normal',pPt:0,dPt:0,field:[],pQ:[],dQ:[],time:CFG.roundSec,big:'',msg:null,rn:0};
let timers=[],deadline=0,aiT=null;
const at=(ms,f)=>{const t=setTimeout(f,ms);timers.push(t);return t;};
function clearAll(){timers.forEach(clearTimeout);timers=[];clearTimeout(aiT);}
function beep(f,d=.08,g=.12){try{const A=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),v=A.createGain();o.frequency.value=f;v.gain.setValueAtTime(g,A.currentTime);v.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(v).connect(A.destination);o.start();o.stop(A.currentTime+d);}catch(e){}}
function start(){clearAll();S={...S,pPt:0,dPt:0,rn:0};round();}
function round(){clearAll();S={...S,phase:'count',rn:S.rn+1,field:[],pQ:draw([]),dQ:draw([]),time:CFG.roundSec,msg:null};
  let c=CFG.countFrom;const tick=()=>{if(c>0){S.big=String(c);beep(520);render();c--;at(CFG.countStepMs,tick);}else{S.big='GO!';beep(880,.15);render();at(CFG.goMs,go);}};tick();}
function go(){S.big='';S.phase='play';deadline=performance.now()+CFG.roundSec*1000;render();loop();aiStep();}
function loop(){if(S.phase!=='play')return;const t=Math.max(0,(deadline-performance.now())/1000);const n=Math.ceil(t);if(n!==S.time){S.time=n;render();}if(t<=0){timeUp();return;}requestAnimationFrame(loop);}
function timeUp(){S.phase='hold';S.msg={t:'時間切れ',k:''};render();beep(200,.3);at(CFG.timeUpMs,next);}
function next(){if(S.pPt>=CFG.winPt||S.dPt>=CFG.winPt){S.phase='end';render();return;}round();}
function play(who){if(S.phase!=='play')return;const q=who==='p'?S.pQ:S.dQ,v=q[0];if(!legal(v,S.field))return;
  S.field=[...S.field,{v,who}];q.shift();draw(q);beep(who==='p'?660:440);
  if(sum(S.field)===10){const r=calcPts(vals(S.field));S[who==='p'?'pPt':'dPt']+=r.total;S.phase='hold';S.msg={t:r.label+' +'+r.total,k:who};render();beep(990,.25,.15);at(CFG.holdMs,next);return;}
  render();}
function discard(who){if(S.phase!=='play')return;const q=who==='p'?S.pQ:S.dQ;q.shift();draw(q);beep(300,.05,.06);render();}
// ── 相手
function aiStep(){const ai=AI[S.level];aiT=setTimeout(()=>{if(S.phase!=='play')return;
  const f=S.field,fs=sum(f),v=S.dQ[0],pv=S.pQ[0],ok=legal(v,f),read=Math.random()<ai.read;
  const threat=legal(pv,f)&&fs+pv===10,gift=ok&&legal(pv,[...f,{v}])&&fs+v+pv===10;
  if(ok&&fs+v===10)play('d');
  else if(ok&&threat&&read&&!gift)play('d');
  else if(ok&&read&&gift)discard('d');
  else if(ok&&Math.random()<ai.safe)play('d');
  else discard('d');
  aiStep();},ai.delay+Math.random()*ai.jitter);}
// ── 画面
const $=s=>document.querySelector(s);
function cells(f){let h='',i=0;f.forEach(x=>{for(let k=0;k<x.v;k++,i++)h+=`<div class="c ${x.who==='p'?'b':'r'}${k===0?' first':''}">${k===0?'<span>'+x.v+'</span>':''}</div>`;});for(;i<10;i++)h+='<div class="c"></div>';return h;}
function block(v,who){const fs=sum(S.field),ok=legal(v,S.field),fit=ok&&fs+v===10;let h='';for(let k=0;k<v;k++)h+=`<div class="c${fs+k>=10?' over':''}${k===0?' first':''}">${k===0?'<span>'+v+'</span>':''}</div>`;
  return `<div class="blk ${who}${fit?' fit':''}${!ok&&fs+v<=10?' ng':''}" style="left:calc(var(--cell)*${Math.min(fs,10)})">${h}</div>`;}
function minis(q){return q.slice(1,CFG.queueN).map(v=>`<span class="mini">${'<i></i>'.repeat(v)}</span>`).join('');}
function render(){const a=$('#app');
  if(S.phase==='title'){a.innerHTML=`<div class="overlay"><h1>NEXT</h1><p>次の札を「だす」か「すてる」。<br>ゲージの空きにぴったりはまれば10！<br>先に${CFG.winPt}点で勝ち。</p><div class="lv">${Object.entries(AI).map(([k,x])=>`<button class="btn ${k===S.level?'on':''}" data-lv="${k}">${x.label}</button>`).join('')}</div><button class="btn" id="st">はじめる</button></div>`;
    a.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{S.level=b.dataset.lv;render();});$('#st').onclick=start;return;}
  const fs=sum(S.field),live=S.phase==='play';
  a.innerHTML=`<div class="hud"><div class="pt"><i style="background:var(--red)"></i>${S.dPt}</div><div class="time">${S.time}</div><div class="pt"><i style="background:var(--blue)"></i>${S.pPt}</div></div>
  <div class="zone opp"><div class="small">${minis(S.dQ)}</div><div class="lane">${block(S.dQ[0],'op')}</div></div>
  <div class="zone mid"><div class="gwrap"><div class="gauge">${cells(S.field)}</div></div><div class="left">あと <b>${10-fs}</b></div></div>
  <div class="zone me"><div class="lane">${block(S.pQ[0],'me')}</div><div class="small">${minis(S.pQ)}</div></div>
  <div class="btns"><button class="btn dis" id="bd" ${live?'':'disabled'}>すてる<span class="tag">仮</span></button><button class="btn play" id="bp" ${live&&legal(S.pQ[0],S.field)?'':'disabled'}>だす<span class="tag">仮</span></button></div>
  ${S.big?`<div class="big">${S.big}</div>`:''}${S.msg?`<div class="msg ${S.msg.k}">${S.msg.t}</div>`:''}
  ${S.phase==='end'?`<div class="overlay"><h1>${S.pPt>=CFG.winPt?'WIN!':'LOSE'}</h1><p>${S.pPt} - ${S.dPt}</p><button class="btn" id="again">もう一度</button><button class="btn" id="home" style="background:#355">もどる</button></div>`:''}`;
  $('#bd').onclick=()=>discard('p');$('#bp').onclick=()=>play('p');
  if(S.phase==='end'){$('#again').onclick=start;$('#home').onclick=()=>{S.phase='title';render();};}
  if(S.phase==='count')$('.btns').onpointerdown=()=>{};}
render();
</script></body></html>
