<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>NEXT</title>
<link rel="preload" as="image" href="img/next/arena_background.webp">
<style>
@font-face{font-family:Lilita;src:url(fonts/LilitaOne-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#0b3fb0 url(img/next/arena_background.webp) center/cover no-repeat;font-family:Lilita,"Arial Rounded MT Bold",system-ui,sans-serif;color:#fff}
body{display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* 画面は9:16の箱。座標は layout.json の比率（中心基準） */
#app{position:relative;width:min(100vw,56.25dvh);aspect-ratio:9/16;max-height:100%;container-type:inline-size} /* 背景は body に1枚だけ（箱にも敷くと継ぎ目が出る） */
.L{position:absolute;transform:translate(-50%,-50%)}
.score{left:50%;top:12.1%;width:77.4%;height:7.7%;background:url(img/next/scoreboard_base.webp) center/100% 100% no-repeat}
.score span{position:absolute;top:60%;transform:translate(-50%,-50%);font-size:6.3cqw;white-space:nowrap;color:#fff}
.score small{font-size:2.6cqw;margin-left:.6cqw}
.score .blue{left:22.5%}.score .red{left:75%}
.sum{left:50%;top:39.6%;width:19.5%;height:3.7%;background:url(img/next/sum_base.webp) center/100% 100% no-repeat;display:grid;place-items:center;font-size:3.9cqw;color:#fff}
.card,.slot{position:absolute;width:20.2%;aspect-ratio:5/7;transform:translate(-50%,-50%) scale(var(--sc,1))}
.card{filter:drop-shadow(0 .35cqw .45cqw #002b6455);transition:left .12s}
.timer{left:87%;top:63.7%;width:16.6%;aspect-ratio:1}
.timer img,.timer svg{position:absolute;inset:0;width:100%;height:100%}
.timer text{font-family:Lilita,"Arial Rounded MT Bold",sans-serif}
.btns{position:absolute;left:0;right:0;top:84%;display:flex;justify-content:space-between;align-items:center;padding:0 6%;gap:10%}
.btn{border:none;border-radius:3.5cqw;font-family:inherit;color:#fff;box-shadow:0 1.2cqw 0 #0005}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .4cqw 0 #0005}
.btn.dis{background:#5b6f95;width:32%;height:13cqw;font-size:4.6cqw}
.btn.play{background:#1f6fe0;width:52%;height:17cqw;font-size:6.6cqw}
.btn[disabled]{filter:grayscale(.6) brightness(.8)}
.tag{font-size:2.6cqw;opacity:.6;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;background:#0a1c4acc;z-index:5;text-align:center;padding:6cqw}
.overlay h1{font-size:12cqw}.overlay p{font-size:4cqw;line-height:1.7;opacity:.9;font-family:system-ui,sans-serif}
.overlay .btn{background:#1f6fe0;width:56cqw;height:14cqw;font-size:5.4cqw}
.lv{display:flex;gap:2.5cqw}.lv .btn{width:auto!important;padding:0 4cqw;height:12cqw!important;background:#3b4f7a!important;font-size:4.4cqw!important}
.lv .btn.on{background:#1f6fe0!important}
.big{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:20cqw;text-shadow:0 1cqw 0 #0006;pointer-events:none;z-index:4}
.msg{position:absolute;left:0;right:0;top:39.6%;transform:translateY(-50%);text-align:center;font-size:8cqw;pointer-events:none;z-index:4;text-shadow:0 .8cqw 0 #0008}
.msg.p{color:#bfe3ff}.msg.d{color:#ffc9bf}
</style></head>
<body><div id="app"></div>
<script>
// NEXT オンライン版の試作：くるみ提供の素材 tenkuru-next-assets（青いアリーナ・UNO風の札・スコア枠・時計・合計枠・空き枠）
// ルールは本体のネクストと同じ。ボタンは仮（画像はくるみが後で用意）。数値は CFG / LAY に集約
const CFG={winPt:10,roundSec:10,countFrom:5,countStepMs:650,goMs:500,holdMs:1500,timeUpMs:1200,queueN:3};
const AI={easy:{label:'やさしい',delay:1250,jitter:600,read:.3,safe:.4},normal:{label:'ふつう',delay:650,jitter:650,read:.7,safe:.55},hard:{label:'つよい',delay:360,jitter:300,read:.95,safe:.85}};
// ── ルール（本体のネクストと同じ。canPlay・calcPts は本体からそのまま）
function canPlay(v,fieldSum,field){
  if(field.filter(x=>x!==null).length>=4)return false;
  const filled=field.filter(x=>x!==null).length+1;
  const newSum=fieldSum+v;
  if(filled===3&&newSum<5)return false;
  if(filled===4&&newSum<10)return false;
  return true;
}
function calcPts(cards){
  const s=[...cards].sort((a,b)=>a-b);
  if(cards.length===4&&s.join('')==='1234')return{total:5,label:'ストレート'};
  if(cards.length===2&&s[0]===5&&s[1]===5)return{total:1,label:'役なし'};
  const freq={};cards.forEach(v=>{freq[v]=(freq[v]||0)+1;});
  const counts=Object.values(freq);
  if(counts.some(c=>c>=3))return{total:4,label:'スリーカード'};
  if(counts.filter(c=>c===2).length>=2)return{total:3,label:'ツーペア'};
  if(counts.some(c=>c===2))return{total:2,label:'ワンペア'};
  return{total:1,label:'役なし'};
}
const vals=f=>f.map(x=>x.v),sum=f=>f.reduce((a,x)=>a+x.v,0);
function legal(v,f){const s=sum(f);return v>=1&&v<=5&&f.length<4&&s+v<=10&&canPlay(v,s,vals(f));}
function draw(q){while(q.length<CFG.queueN+6){const v=1+Math.floor(Math.random()*5);if(q.length>=2&&q.slice(-2).every(x=>x===v))continue;q.push(v);}return q;}
// ── 状態
let S={phase:'title',level:'normal',pPt:0,dPt:0,field:[],pQ:[],dQ:[],time:CFG.roundSec,big:'',msg:null,rn:0};
let timers=[],deadline=0,aiT=null;
const at=(ms,f)=>{const t=setTimeout(f,ms);timers.push(t);return t;};
function clearAll(){timers.forEach(clearTimeout);timers=[];clearTimeout(aiT);}
function beep(f,d=.08,g=.12){try{const A=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),v=A.createGain();o.frequency.value=f;v.gain.setValueAtTime(g,A.currentTime);v.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(v).connect(A.destination);o.start();o.stop(A.currentTime+d);}catch(e){}}
function start(){clearAll();S={...S,pPt:0,dPt:0,rn:0};round();}
function round(){clearAll();S={...S,phase:'count',rn:S.rn+1,field:[],pQ:draw([]),dQ:draw([]),time:CFG.roundSec,msg:null};
  let c=CFG.countFrom;const tick=()=>{if(c>0){S.big=String(c);beep(520);render();c--;at(CFG.countStepMs,tick);}else{S.big='GO!';beep(880,.15);render();at(CFG.goMs,go);}};tick();}
function go(){S.big='';S.phase='play';deadline=performance.now()+CFG.roundSec*1000;render();loop();aiStep();}
function loop(){if(S.phase!=='play')return;const t=Math.max(0,(deadline-performance.now())/1000);const n=Math.ceil(t);if(n!==S.time){S.time=n;render();}if(t<=0){timeUp();return;}requestAnimationFrame(loop);}
function timeUp(){S.phase='hold';S.msg={t:'時間切れ',k:''};render();beep(200,.3);at(CFG.timeUpMs,next);}
function next(){if(S.pPt>=CFG.winPt||S.dPt>=CFG.winPt){S.phase='end';render();return;}round();}
function play(who){if(S.phase!=='play')return;const q=who==='p'?S.pQ:S.dQ,v=q[0];if(!legal(v,S.field))return;
  S.field=[...S.field,{v,who}];q.shift();draw(q);beep(who==='p'?660:440);
  if(sum(S.field)===10){const r=calcPts(vals(S.field));S[who==='p'?'pPt':'dPt']+=r.total;S.phase='hold';S.msg={t:r.label+' +'+r.total,k:who};render();beep(990,.25,.15);at(CFG.holdMs,next);return;}
  render();}
function discard(who){if(S.phase!=='play')return;const q=who==='p'?S.pQ:S.dQ;q.shift();draw(q);beep(300,.05,.06);render();}
// ── 相手
function aiStep(){const ai=AI[S.level];aiT=setTimeout(()=>{if(S.phase!=='play')return;
  const f=S.field,fs=sum(f),v=S.dQ[0],pv=S.pQ[0],ok=legal(v,f),read=Math.random()<ai.read;
  const threat=legal(pv,f)&&fs+pv===10,gift=ok&&legal(pv,[...f,{v}])&&fs+v+pv===10;
  if(ok&&fs+v===10)play('d');
  else if(ok&&threat&&read&&!gift)play('d');
  else if(ok&&read&&gift)discard('d');
  else if(ok&&Math.random()<ai.safe)play('d');
  else discard('d');
  aiStep();},ai.delay+Math.random()*ai.jitter);}
// ── 画面（配置は img/next/src/layout.json の初期値）
const LAY={qStep:14.8,qX:[35.8,50.6,65.4],oppY:27.7,meY:71.1,fieldY:50.1,fieldX:[16.7,39.1,61.3,83.7],qScale:[1,1,1],
  timer:{cx:256,cy:298,r:153,w:20,color:'#20CEF3',text:'#08265C'}}; // qScale：後で [1,.8,.8] にすれば先頭以外を縮小できる
const $=s=>document.querySelector(s);
const cardImg=(v,who,x,y,sc=1,z=0)=>`<img class="card" src="img/next/${who==='p'?'blue':'red'}_${v}.webp" alt="${v}" draggable="false" style="left:${x}%;top:${y}%;--sc:${sc};z-index:${z}">`;
function queue(q,who,y){return q.slice(0,CFG.queueN).map((v,i)=>cardImg(v,who,LAY.qX[i],y,LAY.qScale[i],i+1)).join('');} // 先頭＝左（本体と同じ）。後ろの札ほど上に重ねて左上の数字を隠さない
function field(){return LAY.fieldX.map((x,i)=>{const c=S.field[i];return c?cardImg(c.v,c.who,x,LAY.fieldY):`<img class="slot" src="img/next/field_slot.webp" alt="" draggable="false" style="left:${x}%;top:${LAY.fieldY}%">`;}).join('');}
function timer(){const T=LAY.timer,p=Math.max(0,Math.min(1,S.time/CFG.roundSec)),C=2*Math.PI*T.r;
  return `<div class="L timer"><img src="img/next/timer_base.webp" alt="" draggable="false"><svg viewBox="0 0 512 512">${p>0?`<circle cx="${T.cx}" cy="${T.cy}" r="${T.r}" fill="none" stroke="${T.color}" stroke-width="${T.w}" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 ${T.cx} ${T.cy})"/>`:''}<text x="${T.cx}" y="${T.cy+4}" dominant-baseline="middle" text-anchor="middle" fill="${T.text}" font-size="132">${String(Math.ceil(S.time)).padStart(2,'0')}</text></svg></div>`;}
function render(){const a=$('#app');
  if(S.phase==='title'){a.innerHTML=`<div class="overlay"><h1>NEXT</h1><p>次の札を「だす」か「すてる」。<br>場の合計をぴったり10にしよう。<br>先に${CFG.winPt}点で勝ち。</p><div class="lv">${Object.entries(AI).map(([k,x])=>`<button class="btn ${k===S.level?'on':''}" data-lv="${k}">${x.label}</button>`).join('')}</div><button class="btn" id="st">はじめる</button></div>`;
    a.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{S.level=b.dataset.lv;render();});$('#st').onclick=start;return;}
  const fs=sum(S.field),live=S.phase==='play';
  a.innerHTML=`<div class="L score"><span class="blue">${S.pPt}<small>pt</small></span><span class="red">${S.dPt}<small>pt</small></span></div>
  ${queue(S.dQ,'d',LAY.oppY)}
  <div class="L sum">${fs} / 10</div>
  ${field()}
  ${timer()}
  ${queue(S.pQ,'p',LAY.meY)}
  <div class="btns"><button class="btn dis" id="bd" ${live?'':'disabled'}>すてる<span class="tag">仮</span></button><button class="btn play" id="bp" ${live&&legal(S.pQ[0],S.field)?'':'disabled'}>だす<span class="tag">仮</span></button></div>
  ${S.big?`<div class="big">${S.big}</div>`:''}${S.msg?`<div class="msg ${S.msg.k}">${S.msg.t}</div>`:''}
  ${S.phase==='end'?`<div class="overlay"><h1>${S.pPt>=CFG.winPt?'WIN!':'LOSE'}</h1><p>${S.pPt} - ${S.dPt}</p><button class="btn" id="again">もう一度</button><button class="btn" id="home" style="background:#3b4f7a">もどる</button></div>`:''}`;
  $('#bd').onclick=()=>discard('p');$('#bp').onclick=()=>play('p');
  if(S.phase==='end'){$('#again').onclick=start;$('#home').onclick=()=>{S.phase='title';render();};}}
render();
</script></body></html>
