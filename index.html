<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<title>NEXT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#e5cda8;min-height:100dvh;overflow:hidden;position:fixed;width:100%;height:100dvh;touch-action:none;}
/* v319 NEXT: generated courtyard and numerals; all dimensions share one stage. */
.nx-screen{height:100dvh;width:100%;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#e5cda8;color:#102b57;overflow:hidden;user-select:none;touch-action:manipulation;}
.nx-stage{position:relative;width:100%;max-width:560px;height:100%;margin:auto;background:url('img/next-v319/court.webp') center/100% 100% no-repeat;--nx-card-w:17.3%;--nx-card-h:13.1%;}
.nx-stage button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.nx-stage button:focus-visible{outline:3px solid #35c7ff;outline-offset:3px;}
.nx-number{display:inline-flex;align-items:center;justify-content:center;height:100%;gap:1px;vertical-align:middle;}
.nx-number img{display:block;height:100%;width:auto;max-width:none;object-fit:contain;pointer-events:none;}
.nx-score{position:absolute;top:10.5%;width:14.5%;height:4.25%;display:flex;align-items:center;justify-content:center;}
.nx-score-d{left:15.9%;}.nx-score-p{right:15.8%;}.nx-score .nx-number{filter:brightness(0) invert(95%) drop-shadow(0 2px 2px #321);}
.nx-score-label{position:absolute;top:15.95%;font:bold clamp(10px,2.8vw,14px) sans-serif;letter-spacing:.08em;color:#734512;}
.nx-score-label.d{left:19%;}.nx-score-label.p{right:19%;color:#16447b;}
.nx-time{position:absolute;left:49.3%;top:9.3%;width:8%;height:2.6%;display:flex;justify-content:center;}
.nx-time.low{animation:nx-urgent .7s ease-in-out infinite;}
.nx-back{position:absolute;left:1%;top:1%;min-width:44px;min-height:44px;border:1px solid #ad854b80;border-radius:50%;background:#fff4dbdc;color:#745223;font-size:28px!important;z-index:3;}
.nx-card{position:absolute;width:var(--nx-card-w);height:var(--nx-card-h);border:2px solid #d5a953;border-radius:7%;padding:0;background:#fff9ed url('img/next-v319/card.webp') center/100% 100%;box-shadow:0 2px 3px #38200680,inset 0 0 0 1px #fff6d0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.nx-card:after{content:'';position:absolute;bottom:1.5%;left:2%;right:2%;height:12%;background:linear-gradient(#176dde,#074ab4);border-radius:0 0 5px 5px;box-shadow:0 -1px #e5bc69;}
.nx-card.nx-d:after{background:linear-gradient(#d9560a,#a52b06);}
.nx-card .nx-number{height:49%;margin-top:-8%;filter:drop-shadow(0 1px 0 #fff);}
.nx-card.nx-d .nx-number{filter:sepia(1) saturate(6) hue-rotate(335deg);}
.nx-card.nx-head{left:29.6%;}.nx-card.nx-d.nx-head{top:19.6%;}.nx-card.nx-p.nx-head{top:63.65%;}
.nx-card.nx-preview{width:10.8%;height:8%;opacity:.95;}.nx-preview.nx-d{top:24.7%;}.nx-preview.nx-p{top:68.75%;}
.nx-card.nx-preview-1{left:49.3%;}.nx-card.nx-preview-2{left:62.4%;}
.nx-next-label{position:absolute;left:29.6%;width:17.3%;text-align:center;color:#fff5db;font:700 clamp(11px,3.6vw,20px) Georgia,serif;line-height:1;text-shadow:0 1px 2px #351b04;pointer-events:none;}
.nx-next-label.d{top:18.2%;}.nx-next-label.p{top:62.2%;}
/* v322: NX_CFG.mat:false で赤青の手札マットなし背景（court-nomat.webp）。戻すときは mat:true */
.nx-stage.nx-nomat{background-image:url('img/next-v319/court-nomat-v2.webp');}
.nx-stage.nx-nomat .nx-next-label{color:#734512;text-shadow:0 1px 0 #fff3d6;}.nx-stage.nx-nomat .nx-next-label.p{color:#16447b;}
/* v326: NX_CFG.row:true で相手のNEXTと自分のNEXTを同じ段（場の上）に横並び。相手＝左に詰める、自分＝右上。戻すときは row:false */
.nx-stage.nx-row .nx-card.nx-head{width:15.5%;height:11.8%;top:19.6%;}
.nx-stage.nx-row .nx-card.nx-preview{width:9.7%;height:7.2%;top:24.2%;}
.nx-stage.nx-row .nx-card.nx-d.nx-head{left:4%;}
.nx-stage.nx-row .nx-card.nx-d.nx-preview-1{left:21.5%;}.nx-stage.nx-row .nx-card.nx-d.nx-preview-2{left:33.2%;}
.nx-stage.nx-row .nx-card.nx-p.nx-head{left:52%;top:19.6%;}
.nx-stage.nx-row .nx-card.nx-p.nx-preview-1{left:69.5%;}.nx-stage.nx-row .nx-card.nx-p.nx-preview-2{left:81.2%;}
.nx-stage.nx-row .nx-next-label{width:15.5%;top:18.2%;}.nx-stage.nx-row .nx-next-label.d{left:4%;}.nx-stage.nx-row .nx-next-label.p{left:52%;top:18.2%;}
.nx-field-card{top:39.45%;animation:nx-land .18s ease-out;}
.nx-card.nx-ghost{opacity:.42;border-style:dashed;border-color:#c2412f;box-shadow:none;animation:nx-ghost-in .25s ease-out;pointer-events:none;}
@keyframes nx-ghost-in{from{opacity:0;transform:translateY(-6px)}to{opacity:.42;transform:none}}
.nx-completed .nx-card.nx-ghost{display:none;}
.nx-trap{position:absolute;left:50%;top:59.2%;transform:translateX(-50%);font:bold clamp(11px,3.2vw,17px) sans-serif;color:#b3261e;background:#fff8e9e6;border-radius:10px;padding:1px 8px;white-space:nowrap;pointer-events:none;}
.nx-sum{position:absolute;left:25.7%;top:54%;width:48%;height:4.4%;display:flex;align-items:center;justify-content:center;gap:5%;white-space:nowrap;}
.nx-sum .nx-target{height:52%;display:flex;align-items:center;gap:3px;}.nx-sum .nx-target i{font:normal clamp(15px,4.5vw,27px) Georgia,serif;}.nx-sum .nx-left{display:flex;align-items:center;height:100%;gap:5px;margin-left:6%;}.nx-left small{font:bold clamp(10px,2.8vw,16px) sans-serif;}
.nx-action{position:absolute;top:81.25%;width:39%;height:11.7%;background:transparent;border:0;border-radius:12%;padding:0;}
.nx-action.discard{left:9.1%;}.nx-action.play{left:52.5%;}.nx-action:active{background:#b48b3533;box-shadow:inset 0 4px 5px #5d3c2338;transform:translateY(2px);}
.nx-action:disabled{cursor:default;background:#e7d9c575;}.nx-action.blocked{background:#d7c7ac50;}
.nx-count,.nx-message{position:absolute;z-index:4;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 24px;border:2px solid #c99c50;border-radius:18px;background:#fff8e9f2;box-shadow:0 5px 18px #4b30154d;pointer-events:none;white-space:nowrap;color:#133566;}
.nx-count{height:14%;min-width:25%;font:bold clamp(36px,12vw,64px) Georgia,serif;}.nx-count .nx-number{height:100%;}.nx-message{font:bold clamp(15px,4vw,23px) sans-serif;}.nx-message .nx-number{height:30px;}
.nx-reject{animation:nx-shake .25s ease!important;}.nx-discarding{animation:nx-shuffle .18s ease-out;}
.nx-overlay{position:absolute;inset:0;z-index:8;background:#785b353d;display:flex;align-items:center;justify-content:center;padding:24px;}
.nx-dialog{width:100%;max-width:340px;padding:25px 22px;background:linear-gradient(135deg,#fffcf2,#f4e5ca);border:3px solid #cfa555;box-shadow:0 6px 25px #50361970,inset 0 0 0 2px #fff7db;border-radius:24px;text-align:center;display:flex;flex-direction:column;gap:16px;font:500 14px/1.7 sans-serif;}
.nx-dialog h1{font:700 30px Georgia,serif;letter-spacing:.07em;}.nx-dialog p{margin:0;}.nx-dialog button{min-height:48px;border:1px solid #aa803c;border-radius:12px;background:linear-gradient(#287de0,#1252a9);color:#fff;font-weight:bold;padding:10px;}.nx-dialog .nx-home{background:transparent;color:#5e492d;border:0;}.nx-levels{display:flex;gap:5px;}.nx-levels button{flex:1;background:#fff9e9;color:#7a6040;padding:8px 3px;font-size:12px;}.nx-levels button[aria-pressed=true]{background:#174f92;color:#fff;}.nx-result{display:flex;align-items:center;justify-content:center;gap:18px;height:42px;}
@keyframes nx-land{from{transform:translateY(-12px) scale(.93);opacity:.5}to{transform:none;opacity:1}}
@keyframes nx-shuffle{from{transform:translateX(8px);opacity:.4}to{transform:none;opacity:1}}
@keyframes nx-shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
@keyframes nx-urgent{50%{filter:sepia(1) saturate(8);transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.nx-stage *{animation:none!important;transition:none!important;}}
/* v320 NEXT: coordinated completion, point travel and score impact. */
.nx-stage{overflow:hidden;}
.nx-completed .nx-field-card{animation:nx-card-reward .65s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--slot,0)*35ms);box-shadow:0 0 0 2px #fff8d1,0 0 22px #ffbf2b,inset 0 0 12px #ffe5a9;}
.nx-celebration{position:absolute;inset:0;z-index:5;pointer-events:none;--reward-color:#1b64be;--reward-light:#8fdcff;}
.nx-celebration-d{--reward-color:#b9430e;--reward-light:#ffd194;}
.nx-burst-ring{position:absolute;left:50%;top:46%;width:35%;aspect-ratio:1;border:4px solid #ffefb0;border-radius:50%;box-shadow:0 0 22px #ffd859,inset 0 0 22px #ffdf83;animation:nx-ring .65s ease-out both;}
.nx-reward-banner{position:absolute;left:9%;top:39.5%;width:82%;min-height:15%;padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px solid #e9c46e;border-radius:18px;background:linear-gradient(130deg,#fffdf3,#ffefd1 50%,#fff8e8);box-shadow:0 0 0 2px #fff7dd,0 7px 20px #75441750,0 0 30px #ffdc7680;color:var(--reward-color);animation:nx-reward-pop 1.45s cubic-bezier(.22,.8,.25,1) both;}
.nx-role-title{font:900 clamp(21px,6.7vw,36px)/1.1 'Noto Sans JP',sans-serif;letter-spacing:.03em;text-shadow:0 2px #fff,0 3px 0 #decaa5;display:flex;align-items:center;justify-content:center;gap:6px;}
.nx-role-title .nx-number{height:36px;}.nx-role-points{display:flex;align-items:center;justify-content:center;gap:5px;height:clamp(40px,7.6vh,65px);font:bold 42px Georgia,serif;}.nx-role-points .nx-number{height:100%;}
.nx-celebration.big .nx-reward-banner{border-color:#dba337;box-shadow:0 0 0 3px #fff4c7,0 8px 25px #65411760,0 0 55px #ffd251d9;}
.nx-celebration.big .nx-role-title{color:#9c640b;}.nx-celebration.big .nx-role-points{height:clamp(48px,8.4vh,72px);}
.nx-particles{position:absolute;left:50%;top:46%;width:0;height:0;}
.nx-particles i{position:absolute;width:7px;height:11px;border-radius:2px;background:#ecc15a;box-shadow:0 0 5px #fff0bc;animation:nx-spark 1s ease-out var(--delay) both;}
.nx-particles i:nth-child(3n){background:var(--reward-color);}.nx-particles i:nth-child(3n+1){background:var(--reward-light);width:5px;height:5px;border-radius:50%;}
.nx-point-flight{position:absolute;left:50%;top:47%;display:flex;align-items:center;justify-content:center;gap:2px;height:42px;padding:6px 10px;background:#fff2be;border:2px solid #ddac43;border-radius:50%;box-shadow:0 0 18px #ffe19b;color:#926b23;font:bold 30px Georgia,serif;animation:nx-score-flight .55s .28s cubic-bezier(.5,0,.75,1) both;}
.nx-point-flight .nx-number{height:100%;}
.nx-score.nx-earned{animation:nx-score-impact .5s ease-out;}
@keyframes nx-card-reward{0%{transform:scale(1)}20%{transform:translateY(-5px) scale(1.055);filter:brightness(1.3)}60%{transform:translateY(-2px) scale(1.025)}100%{transform:none}}
@keyframes nx-ring{0%{transform:translate(-50%,-50%) scale(.35);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.8);opacity:0}}
@keyframes nx-reward-pop{0%,7%{transform:scale(.55);opacity:0}19%{transform:scale(1.07);opacity:1}28%,79%{transform:scale(1);opacity:1}100%{transform:translateY(-8px) scale(.98);opacity:0}}
@keyframes nx-spark{0%{transform:translate(0,0) scale(.3);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--turn)) scale(.4);opacity:0}}
@keyframes nx-score-flight{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}12%,30%{opacity:1}100%{left:var(--score-x);top:12.5%;transform:translate(-50%,-50%) scale(.3);opacity:0}}
@keyframes nx-score-impact{0%{transform:scale(1)}28%{transform:scale(1.24);filter:drop-shadow(0 0 10px #ffe081)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.nx-celebration *,.nx-completed .nx-field-card,.nx-score.nx-earned{animation:none!important;}.nx-particles,.nx-point-flight,.nx-burst-ring{display:none;}}
.nx-dialog .nx-online{background:#fff9e9;color:#174f92;border:1px solid #aa803c;}
.nx-lobby{z-index:30;}
.nx-code{font:700 44px/1 Georgia,serif;letter-spacing:.25em;color:#102b57;padding:6px 0 6px .25em;}
.nx-code-input{font:700 36px/1 Georgia,serif;letter-spacing:.3em;text-align:center;width:100%;padding:10px;border:2px solid #cfa555;border-radius:12px;background:#fffdf6;color:#102b57;}
.nx-net-err{color:#b3261e;font-weight:700;}
.nx-dialog button[disabled]{opacity:.7;}
.nx-net-note{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:25;background:#102b57e6;color:#fff;padding:10px 16px;border-radius:12px;font:700 15px sans-serif;white-space:nowrap;pointer-events:none;}
.nx-loading{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#fffaf0 0%,#f1dfbf 55%,#dcc193 100%);color:#102b57;}
.nx-loading-title{font:700 44px Georgia,serif;letter-spacing:.12em;}
.nx-loading-bar{width:62%;max-width:280px;height:12px;border-radius:8px;background:#fff8e6;border:2px solid #cfa555;overflow:hidden;box-shadow:inset 0 1px 3px #0002;}
.nx-loading-bar i{display:block;height:100%;background:linear-gradient(90deg,#287de0,#1252a9);border-radius:6px;transition:width .2s;}
.nx-loading-text{font:600 14px sans-serif;color:#5e492d;}
.nx-card.nx-p.nx-head{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .16s ease-out;}
.nx-card.nx-p.nx-head.nx-dragging{transition:none;z-index:40;box-shadow:0 10px 18px #38200670,inset 0 0 0 1px #fff6d0;cursor:grabbing;}

.nx-ver{position:fixed;right:max(6px,env(safe-area-inset-right));bottom:max(4px,env(safe-area-inset-bottom));font:600 11px sans-serif;color:#5e492d;opacity:.55;z-index:100;pointer-events:none;}
@font-face{font-family:'NxLilita';src:url('fonts/LilitaOne-Regular.ttf') format('truetype');font-display:swap;}
.nx-callout{position:absolute;left:0;right:0;top:25.5%;z-index:6;display:flex;justify-content:center;pointer-events:none;}

.nx-callout span{font:normal clamp(20px,6.4vw,34px)/1 'NxLilita','Arial Black',sans-serif;letter-spacing:.03em;white-space:nowrap;color:#fff;transform:skewX(-10deg);padding:.18em .7em;background:linear-gradient(90deg,#0000,#0b2a5ccc 18%,#0b2a5ccc 82%,#0000);text-shadow:0 2px 0 #0b2a5c,0 0 10px #4db8ff;animation:nx-callout 1.5s cubic-bezier(.2,.9,.3,1) both;}

.nx-dialog .nx-bgm-btn{align-self:center;width:auto;min-width:0;min-height:34px;margin:0;padding:4px 14px;border:1px solid #b08b4f;border-radius:999px;background:#fffaf0;color:#5a4424;font:700 13px sans-serif;box-shadow:none;}
.nx-ver-badge{align-self:center;display:inline-block;margin-top:-6px;padding:3px 12px;border-radius:999px;background:#174f92;color:#fff;font:700 13px/1.4 sans-serif;letter-spacing:.04em;}
.nx-meter{position:absolute;left:50%;top:0.6%;transform:translateX(-50%);z-index:30;background:#102b57d9;color:#fff;font:700 12px/1.5 sans-serif;padding:2px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;}
.nx-card .nx-number.nx-colored,.nx-card.nx-d .nx-number.nx-colored{filter:drop-shadow(0 1px 0 #fff);} /* 数字の色は数字ごと。持ち主は下の帯で見分ける */

/* ── v19 新デザイン（img/next-v2）。画面は 9:16 の箱に固定し、背景の帯に合わせて置く。
   帯：0〜8% 点と時計／8〜24% 相手のNEXT／24〜60% 場／60〜84% 自分のNEXT／84〜100% ゴミ箱。
   札は 幅w% のとき 高さ=w×1.4×9/16 % ＝ w×0.7875 %。位置は左上の角で指定（ドラッグの transform とぶつけないため） */
.nx-screen.nx-v2s{display:flex;align-items:center;justify-content:center;background:linear-gradient(#3c4252 50%,#a8692f 50%);}
.nx-stage.nx-v2{width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16));height:auto;aspect-ratio:9/16;max-width:none;flex:none;background:url('img/next-v2/bg.webp') center/100% 100% no-repeat;}
.nx-v2 .nx-next-label,.nx-v2 .nx-score-label{display:none;}

.nx-v2 .nx-score-d{left:8.5%;background-image:url('img/next-v2/score-d.webp');}.nx-v2 .nx-score-p{right:auto;left:66.5%;background-image:url('img/next-v2/score-p.webp');}

.nx-v2 .nx-card.nx-head{left:20.5%;}.nx-v2 .nx-card.nx-d.nx-head{top:8.52%;}.nx-v2 .nx-card.nx-p.nx-head{top:64.52%;}
.nx-v2 .nx-card.nx-preview{width:13%;height:10.24%;opacity:1;}.nx-v2 .nx-preview.nx-d{top:12.08%;}.nx-v2 .nx-preview.nx-p{top:68.08%;}
.nx-v2 .nx-card.nx-preview-1{left:41%;}.nx-v2 .nx-card.nx-preview-2{left:55%;}

.nx-v2 .nx-action.discard.nx-trash{left:39%;top:86.3%;width:22%;height:12.375%;border-radius:50%;background:url('img/next-v2/trash.webp') center/100% 100% no-repeat;box-shadow:none;}

function NxBoot(){
 const[p,setP]=useState(0),[ready,setReady]=useState(false);
 useEffect(()=>{const t0=Date.now();nxLoadAll(setP).then(()=>{setP(1);setTimeout(()=>setReady(true),Math.max(0,450-(Date.now()-t0)));});},[]);
 if(ready)return h(NextMode,{onBack:()=>location.reload()});
 return h('main',{className:'nx-loading',role:'status','aria-label':'読み込み中'},
  h('div',{className:'nx-loading-title'},'NEXT'),
  h('div',{className:'nx-loading-bar'},h('i',{style:{width:Math.round(p*100)+'%'}})),
  h('div',{className:'nx-loading-text'},'読み込み中… '+Math.round(p*100)+'%'),
  h('div',{className:'nx-ver-badge'},'バージョン '+APP_VER));
}
// 自動更新：起動時と画面が前に戻った時に version.txt を見て、新しい版があれば読み直す（オンライン対戦中は読み直さない）
(function(){
 const KEY='nx-reload-for';let last=0;
 async function check(){
  if(window.__nxBusy||Date.now()-last<30000)return;last=Date.now();
  try{const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
   const v=(await r.text()).trim();if(!v||v===APP_VER||localStorage.getItem(KEY)===v)return;
   localStorage.setItem(KEY,v);location.replace(location.pathname+'?v='+encodeURIComponent(v));}catch(e){}
 }
 check();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check();});
})();
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,h(NxBoot)));
</script></body></html>
